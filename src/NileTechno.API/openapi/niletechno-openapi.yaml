  /api/orders:
    get:
      tags: [Orders]
      summary: List orders
      responses:
        '200':
          description: Orders, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }

    post:
      tags: [Orders]
      summary: Create order
      description: حفظ الطلب في Ec_Orders ثم فتح فاتورة ERP تلقائيًا (wh_TransHeader TransType=3 + wh_TransDetails) فيُخصم المخزون من ERP ويظهر في المتجر خلال دقيقتين. فشل الفاتورة لا يُفشل الطلب (إعادة محاولة تلقائية في الخلفية). الطلب المصحوب بتوكن يُسجَّل باسم حساب التوكن ولا يُستخدم فيه `userId` القادم من الـ body (منعًا لختم سلة عميل آخر في أوردر غريب)، والشراء كزائر بدون توكن يحتفظ بسلوك `userId` من الـ body.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  order: { $ref: '#/components/schemas/Order' }
        '400':
          description: بيانات ناقصة أو منتج غير متاح — {success:false, errors:["اسم العميل مطلوب", "المنتج 'X' غير موجود أو غير متاح حاليًا", ...]}
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  errors:
                    type: array
                    items: { type: string }

  /api/orders/user/{userId}:
    get:
      tags: [Orders]
      summary: List orders of one account
      description: أوردرات عميل محدد — يفتحها صاحب الحساب نفسه أو Admin/MainAdmin فقط، وغير ذلك 403.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Orders (may be empty), newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }
        '401': { description: Requires login }
        '403': { description: غير مسموح الاطلاع على أوردرات عميل آخر }

  /api/orders/{id}:
    get:
      tags: [Orders]
      summary: Get one order by id or order number
      description: يقبل `123` أو `ORD-153012-AB12CD` — يفتحها صاحب الأوردر (مطابقته بحسابه أو بإيميله) أو Admin/MainAdmin فقط.
