openapi: 3.0.3
info:
  title: NileTechno API
  description: |
    Frontend API Reference for NileTechno E-Commerce API.
    JSON fields use camelCase. Public product/catalog data only includes active ERP products/groups.
  version: 1.0.0

servers:
  - url: https://my-back-end-jayl.onrender.com
    description: Production
  - url: http://localhost:5080
    description: Local Development

tags:
  - name: Health
  - name: Authentication
  - name: Products
  - name: Stock
  - name: Orders
  - name: Reviews
  - name: Cart
    description: >-
      السلة تُخزَّن في جدول dbo.Ec_Cart: userId = اي دي حساب العميل، وProductID = اي دي المنتج في EC_Products،
      وProductServerId = اي دي الصنف في ERP (عمود ItemId)، واللوون والمقاس داخل عمود Notes كـ JSON.
      أي صنف Status=0 أو مجموعته Status=0 لا تظهر في الكارت ولا يمكن اضافتها (400).
      صفوف السلة لا تُحذف فعليًا: الإزالة تسجّل Status=0 والصف يبقى في Ec_Cart، وعند إنشاء أوردر تُختم صفوف اليوزر المرئية بـ OrderID فتختفي من الكارت وتبقى كسجل تاريخي.
  - name: Wishlist
  - name: Addresses
  - name: Coupons
  - name: Shipping & Payment
  - name: Store Settings
  - name: Users
  - name: Abandoned Carts
  - name: Activity Logs
  - name: Analytics
  - name: AI Smart Search
  - name: Email

security:
  - {}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token. Expires after 60 minutes.

  schemas:
    ErrorResponse:
      type: object
      properties:
        title: { type: string }
        status: { type: integer }
        errors:
          type: array
          items: { type: string }

    ErrorArrayResponse:
      type: object
      properties:
        errors:
          type: array
          items: { type: string }

    SuccessResponse:
      type: object
      properties:
        success: { type: boolean }

    MessageResponse:
      type: object
      properties:
        message: { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    RegisterRequest:
      type: object
      required: [email, password, fullName]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        fullName: { type: string }

    AuthResponse:
      type: object
      description: رد الكريدشنز الكامل — متطابق في login و register و google و refresh-token (الريجستر يرجع نفس الرد ده فورًا للتسجيل التلقائي)
      properties:
        userId: { type: integer }
        email: { type: string, format: email }
        fullName: { type: string }
        roles:
          type: array
          items: { type: string }
        accessToken: { type: string }
        accessTokenExpiresAtUtc: { type: string, format: date-time }
        refreshToken: { type: string }
        loyaltyPoints: { type: integer }
        phone: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        authProvider:
          type: string
          enum: [Password, Google]

    GoogleAuthRequest:
      type: object
      properties:
        accessToken: { type: string }
        idToken: { type: string }
      description: Send either accessToken or idToken.

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    Profile:
      type: object
      properties:
        userId: { type: integer }
        email: { type: string, format: email }
        fullName: { type: string }
        phone: { type: string, nullable: true }
        loyaltyPoints: { type: integer }
        authProvider: { type: string }
        emailConfirmed: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: string, format: date-time, nullable: true }

    ProfileUpdateRequest:
      type: object
      properties:
        fullName: { type: string }
        phone: { type: string }

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password, minLength: 6 }

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    ResetPasswordRequest:
      type: object
      required: [email, token, newPassword]
      properties:
        email: { type: string, format: email }
        token: { type: string }
        newPassword: { type: string, format: password }

    EmailRequest:
      type: object
      required: [email, name]
      properties:
        email: { type: string, format: email }
        name: { type: string }

    VerificationEmailRequest:
      allOf:
        - $ref: '#/components/schemas/EmailRequest'
        - type: object
          required: [verificationLink]
          properties:
            verificationLink: { type: string, format: uri }

    PasswordResetEmailRequest:
      allOf:
        - $ref: '#/components/schemas/EmailRequest'
        - type: object
          required: [resetLink]
          properties:
            resetLink: { type: string, format: uri }

    LoginNotificationRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        name: { type: string }
        ipAddress: { type: string }
        device: { type: string }

    OrderStatusEmailRequest:
      type: object
      required: [order, newStatus, email, name]
      properties:
        order: { type: object, additionalProperties: true }
        newStatus: { type: string }
        email: { type: string, format: email }
        name: { type: string }

    GenericEmailRequest:
      type: object
      required: [toEmail, subject, title, messageHtml]
      properties:
        toEmail: { type: string, format: email }
        subject: { type: string }
        title: { type: string }
        messageHtml: { type: string }

    Product:
      type: object
      properties:
        itemCode: { type: string, example: "12668" }
        itemId: { type: string, example: "66570" }
        itemName: { type: string }
        groupId: { type: string }
        groupName: { type: string }
        stock: { type: number, format: double }
        price: { type: number, format: double }
        image: { type: string }
        description: { type: string }

    Category:
      type: object
      properties:
        groupId: { type: string }
        groupName: { type: string }
        itemCount: { type: integer }

    PaginatedProductList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        pageNumber: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }
        totalCount: { type: integer }
        hasPreviousPage: { type: boolean }
        hasNextPage: { type: boolean }

    StockResponse:
      type: object
      additionalProperties:
        type: number
        format: double

    ProductStock:
      type: object
      properties:
        productId: { type: string }
        stock: { type: number, format: double }

    StockDecrementItem:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string }
        quantity: { type: number, format: double }

    StockDecrementRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/StockDecrementItem' }

    StockDecrementResponse:
      type: object
      properties:
        success: { type: boolean }
        stocks:
          type: object
          additionalProperties:
            type: number
            format: double

    DetailedStock:
      type: object
      properties:
        itemCode: { type: string }
        itemName: { type: string }
        transPkgQty1: { type: number, format: double }
        reorderQty: { type: number, format: double }
        storeCode: { type: string }
        storeName: { type: string }
        groupId: { type: string }
        groupName: { type: string }

    PaginatedStockList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DetailedStock' }
        pageNumber: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }
        totalCount: { type: integer }
        hasPreviousPage: { type: boolean }
        hasNextPage: { type: boolean }

    Coordinates:
      type: object
      properties:
        lat: { type: number, format: double }
        lng: { type: number, format: double }

    OrderItem:
      type: object
      required: [productId, price, quantity]
      properties:
        productId: { type: string }
        name: { type: string }
        price: { type: number, format: double }
        quantity: { type: integer }
        image: { type: string }
        selectedColor: { type: string, nullable: true }
        selectedSize: { type: string, nullable: true }

    CreateOrderRequest:
      type: object
      description: >
        إجباري: customerName، customerPhone، governorate، عنوان التوصيل
        (أي من address/addressDetails/customerAddress)، items (منتج واحد على الأقل
        بـ productId صحيح وquantity ≥ 1)، total. الخطأ يرجع 400 بصيغة {success:false, errors:[...]}
      required: [customerName, customerPhone, governorate, items, total]
      properties:
        userId: { type: string }
        customerName: { type: string }
        customerPhone: { type: string }
        customerEmail: { type: string, format: email }
        customerAddress: { type: string }
        address: { type: string }
        addressDetails: { type: string }
        customerNotes: { type: string }
        governorate: { type: string }
        coordinates: { $ref: '#/components/schemas/Coordinates' }
        paymentMethod: { type: string }
        couponCode: { type: string }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderItem' }
        total: { type: number, format: double }
        subtotal: { type: number, format: double }
        shippingCost: { type: number, format: double }
        discountAmount: { type: number, format: double }

    OrderHistoryEntry:
      type: object
      properties:
        action: { type: string }
        actor: { type: string }
        type: { type: string }
        newStatus: { type: string }
        timestamp: { type: string, format: date-time }

    Order:
      type: object
      properties:
        id: { type: integer }
        orderNumber: { type: string }
        userId: { type: string, nullable: true }
        status:
          type: string
          enum: [PENDING, PROCESSING, PACKED, SHIPPED, OUT_FOR_DELIVERY, DELIVERED, CANCELED, REFUNDED]
        cancelReason: { type: string, nullable: true }
        internalNote: { type: string, nullable: true }
        customerName: { type: string }
        customerEmail: { type: string, nullable: true }
        customerPhone: { type: string }
        customerNotes: { type: string, nullable: true }
        governorate: { type: string, nullable: true }
        customerAddress: { type: string, nullable: true }
        addressDetails: { type: string, nullable: true }
        latitude: { type: number, format: double, nullable: true }
        longitude: { type: number, format: double, nullable: true }
        paymentMethod: { type: string, nullable: true }
        couponCode: { type: string, nullable: true }
        discountAmount: { type: number, format: double }
        subtotal: { type: number, format: double }
        shippingCost: { type: number, format: double }
        total: { type: number, format: double }
        date: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        history:
          type: array
          items: { $ref: '#/components/schemas/OrderHistoryEntry' }

    UpdateOrderStatusRequest:
      type: object
      required: [orderId, newStatus]
      properties:
        orderId:
          oneOf:
            - { type: integer }
            - { type: string }
        newStatus:
          type: string
          enum: [PENDING, PROCESSING, PACKED, SHIPPED, OUT_FOR_DELIVERY, DELIVERED, CANCELED, REFUNDED]
        cancelReason: { type: string }

    BulkUpdateOrderStatusRequest:
      type: object
      required: [orderIds, newStatus]
      properties:
        orderIds:
          type: array
          items: { type: integer }
        newStatus:
          type: string
          enum: [PENDING, PROCESSING, PACKED, SHIPPED, OUT_FOR_DELIVERY, DELIVERED, CANCELED, REFUNDED]
        cancelReason: { type: string }

    UpdateOrderNoteRequest:
      type: object
      required: [orderId, note]
      properties:
        orderId:
          oneOf:
            - { type: integer }
            - { type: string }
        note: { type: string }

    CreateReviewRequest:
      type: object
      required: [productId, rating, comment, customerName]
      properties:
        productId: { type: string }
        orderId: { type: integer, nullable: true }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }
        customerName: { type: string }

    Review:
      type: object
      properties:
        id: { type: string }
        externalId: { type: string }
        productId: { type: string }
        orderId: { type: integer, nullable: true }
        rating: { type: integer }
        comment: { type: string }
        customerName: { type: string }
        approved: { type: boolean }
        date: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    CartItemInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string }
        quantity: { type: integer }
        color: { type: string, nullable: true }
        size: { type: string, nullable: true }

    CartSyncRequest:
      type: object
      required: [items]
      properties:
        userId: { type: string, description: يُتجاهل لغير الأدمن — الهوية تُؤخذ من التوكن. الأدمن فقط يستطيع تحديد حساب آخر. }
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItemInput' }

    CartProduct:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        title: { type: string }
        price: { type: number, format: double }
        image: { type: string }
        stock: { type: number, format: double }
        groupId: { type: string }
        category: { type: string }

    CartItem:
      type: object
      description: عنصر السلة — id هو رقم صف جدول Ec_Cart (integer وليس GUID)
      properties:
        id: { type: integer, format: int32 }
        productId: { type: string, description: كود المنتج (EC_Products.Code) }
        quantity: { type: integer }
        color: { type: string, nullable: true }
        size: { type: string, nullable: true }
        product: { $ref: '#/components/schemas/CartProduct' }

    CartUpsertRequest:
      allOf:
        - type: object
          properties:
            userId: { type: string, description: يُتجاهل لغير الأدمن — الهوية تُؤخذ من التوكن }
        - $ref: '#/components/schemas/CartItemInput'

    WishlistItem:
      type: object
      properties:
        id: { type: string }
        productId: { type: string }
        product: { $ref: '#/components/schemas/CartProduct' }

    WishlistRequest:
      type: object
      required: [productId]
      properties:
        userId: { type: string, description: يُتجاهل لغير الأدمن — الهوية من التوكن }
        productId: { type: string }

    WishlistSyncRequest:
      type: object
      required: [productIds]
      properties:
        userId: { type: string, description: يُتجاهل لغير الأدمن — الهوية من التوكن }
        productIds:
          type: array
          items: { type: string }

    Address:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string }
        label: { type: string }
        governorate: { type: string }
        details: { type: string }
        latitude: { type: number, format: double, nullable: true }
        longitude: { type: number, format: double, nullable: true }
        isDefault: { type: boolean }
        createdAt: { type: string, format: date-time }

    AddressInput:
      type: object
      required: [label, governorate, details, isDefault]
      properties:
        userId: { type: string, description: يُتجاهل لغير الأدمن — الهوية من التوكن }
        id:
          type: string
          format: uuid
          nullable: true
          example: null
          description: |
            اختياري. اتركه null او احذفه لانشاء عنوان جديد.
            قيمته فقط عند التعديل ويجب ان تكون id عنوان موجود فعلًا لنفس الـ userId؛
            id غير موجود يرجع 404 "العنوان غير موجود".
        label: { type: string }
        governorate: { type: string }
        details: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        isDefault: { type: boolean }

    AddressSyncRequest:
      type: object
      required: [addresses]
      properties:
        userId: { type: string, description: يُتجاهل لغير الأدمن — الهوية من التوكن }
        addresses:
          type: array
          items: { $ref: '#/components/schemas/AddressInput' }

    Coupon:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        discountPercent: { type: number, format: double }
        isActive: { type: boolean }
        expiresAt: { type: string, format: date-time, nullable: true }
        maxUses: { type: integer, nullable: true }
        usedCount: { type: integer }

    ValidateCouponRequest:
      type: object
      required: [code, subtotal]
      properties:
        code: { type: string }
        subtotal: { type: number, format: double }

    ValidateCouponResponse:
      type: object
      properties:
        valid: { type: boolean }
        code: { type: string }
        discountPercent: { type: number, format: double }
        discount: { type: number, format: double }
        error: { type: string }

    CouponInput:
      type: object
      required: [code, discountPercent]
      properties:
        code: { type: string }
        discountPercent: { type: number, format: double }
        isActive: { type: boolean }
        expiresAt: { type: string, format: date-time }
        maxUses: { type: integer }

    ShippingZone:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        price: { type: number, format: double }
        active: { type: boolean }

    ShippingZoneInput:
      type: object
      required: [name, price, active]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        price: { type: number, format: double }
        active: { type: boolean }

    PaymentMethod:
      type: object
      properties:
        id: { type: string, example: cod }
        name: { type: string }
        description: { type: string }

    ShippingMethod:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        price: { type: number, format: double }
        description: { type: string }

    StoreConfig:
      type: object
      properties:
        storeName: { type: string }
        storeTitle: { type: string }
        promoTagline: { type: string }
        logoUrl: { type: string }
        primaryColor: { type: string }
        freeShippingMin: { type: number, format: double }
        announcementText: { type: string }
        announcementEnabled: { type: boolean }
        extraJson: { type: string }

    UserAdmin:
      type: object
      properties:
        uid: { type: string }
        userId: { type: integer }
        email: { type: string, format: email }
        name: { type: string }
        fullName: { type: string }
        phone: { type: string, nullable: true }
        role:
          type: string
          enum: [main_admin, admin, user]
        points: { type: integer }
        isBlocked: { type: boolean }
        authProvider: { type: string }
        emailConfirmed: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: string, format: date-time, nullable: true }

    PointsRequest:
      type: object
      required: [points]
      properties:
        points: { type: integer }

    AbandonedCartItem:
      type: object
      required: [name, price, quantity]
      properties:
        name: { type: string }
        price: { type: number, format: double }
        quantity: { type: integer }
        image: { type: string }

    AbandonedCartRequest:
      type: object
      required: [customerName, governorate, total, items]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string }
        customerName: { type: string }
        customerPhone: { type: string }
        customerEmail: { type: string, format: email }
        governorate: { type: string }
        total: { type: number, format: double }
        items:
          type: array
          items: { $ref: '#/components/schemas/AbandonedCartItem' }

    ActivityLog:
      type: object
      properties:
        id: { type: integer }
        actorName: { type: string }
        action: { type: string }
        entityType: { type: string, nullable: true }
        entityId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    ActivityLogRequest:
      type: object
      required: [action]
      properties:
        actorName: { type: string }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: string }

    AnalyticsSearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string }

    SmartSearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string }
        products:
          type: array
          items: { $ref: '#/components/schemas/Product' }

    SmartSearchRecommendation:
      type: object
      properties:
        productId: { type: string }
        matchReason: { type: string }
        confidenceScore: { type: number, format: double }

    SmartSearchResponse:
      type: object
      properties:
        aiAdvice: { type: string }
        recommendations:
          type: array
          maxItems: 4
          items: { $ref: '#/components/schemas/SmartSearchRecommendation' }

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: API and database health
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  database: { type: string, example: connected }
                  timeUtc: { type: string, format: date-time }

  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Register a new account
      description: إنشاء حساب جديد وإرجاع نفس رد اللوجين بالكامل فورًا (تسجيل دخول تلقائي بدون خطوة login).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '200':
          description: Registered + full auto-login credentials (same shape as login, or fallback message)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthResponse'
                  - type: object
                    properties:
                      message: { type: string }
                      userId: { type: integer }
                      emailConfirmed: { type: boolean }
        '400':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorArrayResponse' }

  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authentication response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          description: Unauthorized

  /api/auth/google:
    post:
      tags: [Authentication]
      summary: Google authentication
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoogleAuthRequest' }
      responses:
        '200':
          description: Authentication response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          description: Unauthorized

  /api/auth/refresh-token:
    post:
      tags: [Authentication]
      summary: Refresh access token
