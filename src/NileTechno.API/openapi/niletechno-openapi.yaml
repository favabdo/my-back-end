        تعديل عنوان: أرسل `id` عنوان موجود فعلًا لنفس الـ userId، غير ذلك يرجع 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
            example:
              userId: "37"
              id: null
              label: "Home"
              governorate: "Gharbia"
              details: "Tanta, El Bahr Street, Building 15, Apartment 4"
              latitude: 30.7865
